<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rozkład desek</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeecea;
  --text:#1a1a18;--text2:#666;--text3:#999;
  --bd:#ddd;--blue:#1a5fa8;--green:#3b7d11;
  --ok:#eaf3de;--info:#e6f1fb;--warn:#faeeda;--err:#fcebeb;
  --ok-t:#3b6d11;--info-t:#185fa5;--warn-t:#854f0b;--err-t:#a32d2d;
  --toggle-bg:#e0e0de
}
[data-theme=dark]{
  --bg:#1e1e1c;--bg2:#2a2a28;--bg3:#141412;
  --text:#f0f0ec;--text2:#a0a09c;--text3:#666662;
  --bd:#3a3a38;--blue:#5ba3f5;--green:#7ec44f;
  --ok:#173404;--info:#042c53;--warn:#412402;--err:#501313;
  --ok-t:#97c459;--info-t:#85b7eb;--warn-t:#ef9f27;--err-t:#f09595;
  --toggle-bg:#444442
}
body{background:var(--bg3);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);padding:1rem;min-height:100vh;transition:background .2s,color .2s}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.sub{font-size:12px;color:var(--text2);margin-bottom:1rem}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:1rem;margin-bottom:.75rem}
.label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:var(--text2)}
.field input{padding:9px 10px;border:1.5px solid var(--bd);border-radius:7px;font-size:16px;background:var(--bg2);color:var(--text);outline:none;width:100%;-webkit-appearance:none}
.field input:focus{border-color:var(--blue);background:var(--bg)}
.field input.computed{border-color:var(--green);background:var(--ok);color:var(--ok-t);font-weight:500}
.field .sub2{font-size:11px;color:var(--info-t);min-height:14px;line-height:1.4}
.radios{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.radio input{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.msg{border-radius:7px;padding:9px 12px;font-size:13px;margin-bottom:.75rem;display:none}
.msg.on{display:block}
.msg.info{background:var(--info);color:var(--info-t)}
.msg.warn{background:var(--warn);color:var(--warn-t)}
.msg.err{background:var(--err);color:var(--err-t)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:.75rem}
.met{background:var(--bg2);border-radius:7px;padding:10px;text-align:center}
.met .l{font-size:10px;color:var(--text2);margin-bottom:2px}
.met .n{font-size:21px;font-weight:600;color:var(--text)}
.met .u{font-size:10px;color:var(--text3)}
.met.ok{background:var(--ok)}.met.ok .n{color:var(--ok-t)}
.met.info{background:var(--info)}.met.info .n{color:var(--info-t)}
.met.warn{background:var(--warn)}.met.warn .n{color:var(--warn-t)}
.viz{overflow-x:auto;background:var(--bg2);border-radius:7px;padding:10px}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.leg-i{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-s{width:12px;height:12px;border-radius:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 14px;border:1px solid var(--bd);border-radius:7px;background:var(--bg2);color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg3)}
.theme-btn{position:fixed;top:12px;right:12px;width:42px;height:24px;border-radius:12px;background:var(--toggle-bg);border:none;cursor:pointer;padding:0;transition:background .2s}
.theme-btn::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
[data-theme=dark] .theme-btn::after{transform:translateX(18px)}
[data-theme=dark] .theme-btn{background:#5ba3f5}
</style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()" title="Przełącz tryb jasny/ciemny" aria-label="Przełącz tryb ciemny"></button>
<div class="wrap">
  <h1>Rozkład desek</h1>
  <p class="sub">Wypełnij 3 pola — czwarte zostanie obliczone. Wpisując szczelinę lub liczbę desek, drugie pole aktualizuje się na bieżąco.</p>

  <div class="card">
    <p class="label">Parametry</p>
    <div class="grid">
      <div class="field">
        <label>Odcinek [cm]</label>
        <input type="number" id="iL" inputmode="decimal" step="1" min="1" placeholder="np. 200" oninput="onChange('L')">
        <span class="sub2" id="sL"></span>
      </div>
      <div class="field">
        <label>Szerokość deski [cm]</label>
        <input type="number" id="iW" inputmode="decimal" value="11.8" step="0.1" min="0.1" placeholder="11.8" oninput="onChange('W')">
        <span class="sub2" id="sW"></span>
      </div>
      <div class="field">
        <label>Szczelina [cm]</label>
        <input type="number" id="iG" inputmode="decimal" step="0.01" min="0" placeholder="np. 0.66" oninput="onChange('G')">
        <span class="sub2" id="sG"></span>
      </div>
      <div class="field">
        <label>Liczba desek</label>
        <input type="number" id="iN" inputmode="numeric" step="1" min="1" placeholder="np. 15" oninput="onChange('N')">
        <span class="sub2" id="sN"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <p class="label">Krawędzie</p>
    <div class="radios">
      <label class="radio"><input type="radio" name="k" value="ss" checked onchange="recalc()"> Szczelina — deski — szczelina</label>
      <label class="radio"><input type="radio" name="k" value="ds" onchange="recalc()"> Deska — szczeliny — deska</label>
      <label class="radio"><input type="radio" name="k" value="sd" onchange="recalc()"> Szczelina z lewej, deska z prawej</label>
    </div>
  </div>

  <div class="card">
    <p class="label">Zapisz / wczytaj</p>
    <div class="btns">
      <button class="btn" onclick="save()">💾 Zapisz JSON</button>
      <button class="btn" onclick="document.getElementById('fi').click()">📂 Wczytaj JSON</button>
      <input type="file" id="fi" accept=".json" style="display:none" onchange="load(event)">
    </div>
  </div>

  <div class="msg" id="msg"></div>
  <div class="metrics" id="met" style="display:none"></div>

  <div class="card" id="viz-card" style="display:none">
    <p class="label">Wizualizacja</p>
    <div class="viz"><div id="viz"></div></div>
    <div class="leg" id="leg"></div>
  </div>
</div>

<script>
// ── Helpers ──────────────────────────────────────────────
const el = id => document.getElementById(id);
const R2 = v => Math.round(v * 100) / 100;
const R3 = v => Math.round(v * 1000) / 1000;
const getK = () => document.querySelector('input[name=k]:checked').value;
const getNum = id => { const v = parseFloat(el('i'+id).value); return isNaN(v) ? null : v; };

function nG(n, k) {
  if (k === 'ss') return n + 1;
  if (k === 'ds') return Math.max(0, n - 1);
  return n; // sd
}

// Oblicz najlepszą n dla zadanej szczeliny
function bestN(L, W, G, k) {
  let nA;
  const p = W + G;
  if (k === 'ss')      nA = Math.max(1, Math.floor((L - G) / p));
  else if (k === 'ds') nA = Math.max(1, Math.floor((L + G) / p));
  else                 nA = Math.max(1, Math.floor(L / p));
  // Wybierz nA lub nA+1 — ten z mniejszą resztą
  const r = n => { const ng = nG(n, k); return ng <= 0 ? 1e9 : Math.abs(L - n * W - ng * G); };
  return r(nA + 1) < r(nA) ? nA + 1 : nA;
}

// Idealna szczelina dla n desek
function idealG(L, W, n, k) {
  const ng = nG(n, k);
  if (ng <= 0) return null;
  const g = R3((L - n * W) / ng);
  return g >= 0 ? g : null;
}

// ── Ustaw pole jako obliczone (zielone) lub normalne ──────
// Śledź które pola są obliczone (nie wpisane przez użytkownika)
const _computed = {L:false, W:false, G:false, N:false};

function setComputed(id, val) {
  el('i'+id).value = val;
  el('i'+id).classList.add('computed');
  _computed[id] = true;
}
function clearComputed(trigger) {
  ['L','W','G','N'].forEach(id => {
    if (_computed[id] && id !== trigger) {
      el('i'+id).value = '';
      el('i'+id).classList.remove('computed');
      _computed[id] = false;
    }
  });
}
function markUserFields() {} // nie używane już
function setHint(id, txt) { el('s'+id).textContent = txt; }
function clearHints() { ['L','W','G','N'].forEach(id => el('s'+id).textContent = ''); }

function showMsg(txt, type) {
  const m = el('msg');
  if (txt) { m.textContent = txt; m.className = 'msg on ' + type; }
  else m.className = 'msg';
}

// ── Debounce ──────────────────────────────────────────────
let _t = null;
const FIELDS = ['L','W','G','N'];

function onChange(trigger) {
  clearTimeout(_t);
  // Jeśli pole jest puste — wyczyść computed i przelicz bez tego pola
  if (el('i'+trigger).value.trim() === '') {
    if (_computed[trigger]) {
      _computed[trigger] = false;
      el('i'+trigger).classList.remove('computed');
    }
    _t = setTimeout(() => recalc(null), 200);
    return;
  }
  // Pole ma wartość — przelicz z debounce
  _t = setTimeout(() => recalc(trigger), 350);
}

// ── Główna logika ─────────────────────────────────────────
function recalc(trigger = null) {
  clearComputed(trigger);
  clearHints();
  showMsg('', '');

  const L = getNum('L');
  const W = getNum('W');
  const G = getNum('G');
  const N = getNum('N');
  const k = getK();

  if (W === null || W <= 0) { hideResult(); showMsg('Podaj szerokość deski.', 'info'); return; }

  const known = { L: L!==null, W: W!==null, G: G!==null, N: N!==null };
  const nKnown = Object.values(known).filter(Boolean).length;

  if (nKnown < 2) { hideResult(); showMsg('Podaj co najmniej 2 wartości.', 'info'); return; }

  // ── Brak L: W + G + N → oblicz L ──
  if (!known.L && known.W && known.G && known.N) {
    const n = Math.round(N);
    const ng = nG(n, k);
    const l = R2(n * W + Math.max(0, ng) * G);
    setComputed('L', l);
    return draw(l, W, G, n, k);
  }

  // ── Brak W: L + G + N → oblicz W ──
  if (known.L && !known.W && known.G && known.N) {
    const n = Math.round(N);
    const ng = nG(n, k);
    if (ng < 0 || L - ng * G <= 0) { hideResult(); showMsg('Nie można obliczyć szerokości.', 'err'); return; }
    const w = R3((L - ng * G) / n);
    if (w <= 0) { hideResult(); showMsg('Ujemna szerokość — sprawdź wartości.', 'err'); return; }
    setComputed('W', R2(w));
    return draw(L, w, G, n, k);
  }

  // Dalej L i W muszą być podane
  if (!known.L) { hideResult(); showMsg('Podaj odcinek lub wymaganą kombinację: szerokość + szczelina + liczba desek.', 'info'); return; }

  // ── L + W + G + N: G i N oba podane — aktywne steruje ──
  if (known.G && known.N) {
    if (trigger === 'N') {
      const n = Math.round(N);
      const g = idealG(L, W, n, k);
      if (g === null) { hideResult(); showMsg(n + ' desek nie mieści się na ' + L + ' cm.', 'err'); return; }
      setComputed('G', R2(g));
      return draw(L, W, g, n, k);
    }
    // trigger === 'G' lub brak — G steruje
    const n = bestN(L, W, G, k);
    setComputed('N', n);
    showGHints(L, W, G, n, k);
    return draw(L, W, G, n, k);
  }

  // ── L + W + G → oblicz N ──
  if (known.G && !known.N) {
    const n = bestN(L, W, G, k);
    setComputed('N', n);
    showGHints(L, W, G, n, k);
    return draw(L, W, G, n, k);
  }

  // ── L + W + N → oblicz G ──
  if (!known.G && known.N) {
    const n = Math.round(N);
    const g = idealG(L, W, n, k);
    if (g === null) { hideResult(); showMsg(n + ' desek nie mieści się na ' + L + ' cm.', 'err'); return; }
    setComputed('G', R2(g));
    return draw(L, W, g, n, k);
  }

  // ── L + W → oblicz G i N optymalnie ──
  if (!known.G && !known.N) {
    const nMax = Math.floor(L / W);
    if (nMax < 1) { hideResult(); showMsg('Deska szersza od odcinka.', 'err'); return; }
    let best = null, bestScore = 1e9;
    for (let n = 1; n <= nMax; n++) {
      const g = idealG(L, W, n, k);
      if (g === null || g < 0) continue;
      const score = Math.abs(g - 0.8);
      if (score < bestScore) { bestScore = score; best = {n, g}; }
    }
    if (!best) { hideResult(); showMsg('Nie można obliczyć.', 'err'); return; }
    setComputed('G', R2(best.g));
    setComputed('N', best.n);
    const opts = [];
    for (let n = Math.max(1, best.n-3); n <= best.n+3; n++) {
      if (n === best.n) continue;
      const g = idealG(L, W, n, k);
      if (g !== null && g >= 0) opts.push(R2(g) + ' cm (' + n + ' desek)');
    }
    if (opts.length) showMsg('Inne opcje: ' + opts.join('  |  '), 'info');
    return draw(L, W, best.g, best.n, k);
  }
}

// Podpowiedzi dla szczeliny: pokaż idealne dla n-1, n, n+1
function showGHints(L, W, G, n, k) {
  const opts = [];
  for (const ni of [n + 1, n, n - 1]) {
    if (ni < 1) continue;
    const g = idealG(L, W, ni, k);
    if (g !== null && Math.abs(g - G) > 0.01) {
      opts.push(R2(g) + ' cm (' + ni + ' desek)');
    }
  }
  if (opts.length) setHint('G', opts.join('  |  '));
}

function hideResult() {
  el('met').style.display = 'none';
  el('viz-card').style.display = 'none';
}

// ── Wyświetl wyniki ───────────────────────────────────────
function draw(L, W, G, n, k) {
  const ng = nG(n, k);
  const used = R2(n * W + Math.max(0, ng) * G);
  const rest = R2(L - used);
  // Walidacja układu
  const warnings = [];
  if (G < 0) {
    warnings.push('❌ Szczelina ujemna — deski nie mieszczą się na odcinku.');
  }
  if (rest > W) {
    warnings.push('⚠️ Reszta (' + rest + ' cm) jest większa niż deska — można dodać jeszcze ' + Math.floor(rest/(W+G)) + ' deskę.');
  } else if (rest > G + 0.5) {
    warnings.push('⚠️ Ostatnia szczelina (' + R2(rest + (k==="ds"?0:G)) + ' cm) jest większa niż pozostałe — układ niesymetryczny.');
  }
  if (used > L + 0.1) {
    warnings.push('❌ Deski wychodzą poza odcinek o ' + R2(used - L) + ' cm.');
  }
  if (G > W) {
    warnings.push('⚠️ Szczelina (' + R2(G) + ' cm) jest szersza niż deska (' + R2(W) + ' cm) — sprawdź wartości.');
  }
  if (warnings.length) showMsg(warnings.join(' '), 'warn');

  let h = met('Desek', n, 'szt', 'ok')
        + met('Szczelina', R2(G), 'cm', 'info')
        + met('Podziałka', R2(W + G), 'cm', '')
        + met('Odcinek', R2(L), 'cm', 'info');
  if (Math.abs(rest) > 0.1) h += met('Reszta', R2(rest), 'cm', 'warn');
  el('met').innerHTML = h;
  el('met').style.display = 'grid';

  drawViz(L, W, G, n, k);
  el('viz-card').style.display = 'block';
}

function met(l, n, u, cls) {
  return '<div class="met' + (cls ? ' ' + cls : '') + '"><div class="l">' + l + '</div><div class="n">' + n + '</div><div class="u">' + u + '</div></div>';
}

// ── Wizualizacja ──────────────────────────────────────────
function drawViz(L, W, G, n, k) {
  const VW = 720, SHOW = 3, COLLAPSE = 9;
  const H = 48, PY = 28, DY = PY + H + 12, LY = PY + H + 28, SH = LY + 14;
  const ML = 4, MR = 4;
  const col = n > COLLAPSE;

  // Buduj segmenty
  function segs() {
    const s = [];
    if (k === 'ss') {
      s.push({t:'gk',x:0,w:G}); let p=G;
      for (let i=0;i<n;i++) { s.push({t:'d',x:p,w:W,i}); p+=W; s.push({t:i===n-1?'gk':'g',x:p,w:G}); p+=G; }
    } else if (k === 'ds') {
      s.push({t:'d',x:0,w:W,i:0}); let p=W;
      for (let i=1;i<n;i++) { s.push({t:'g',x:p,w:G}); p+=G; s.push({t:'d',x:p,w:W,i}); p+=W; }
    } else {
      s.push({t:'gk',x:0,w:G}); let p=G;
      for (let i=0;i<n;i++) { s.push({t:'d',x:p,w:W,i}); p+=W; if(i<n-1){s.push({t:'g',x:p,w:G});p+=G;} }
    }
    return s;
  }

  const all = segs();
  const deski = all.filter(s => s.t === 'd');

  function r(s, off, sc) {
    const x = ML + off + s.x * sc, w = s.w * sc;
    if (w < 0.3) return '';
    let f, st, tf;
    if      (s.t === 'gk') { f='#FAEEDA'; st='#BA7517'; tf='#633806'; }
    else if (s.t === 'g')  { f='rgba(150,150,150,0.15)'; st='#999'; tf='#666'; }
    else { f = s.i % 2 === 0 ? '#B5D4F4' : '#85B7EB'; st='#185FA5'; tf='#0C447C'; }
    let o = '<rect x="'+x.toFixed(1)+'" y="'+PY+'" width="'+w.toFixed(1)+'" height="'+H+'" fill="'+f+'" stroke="'+st+'" stroke-width="0.7" rx="1"/>';
    if (w > 20) {
      const v = s.t==='d' ? R2(W) : R2(s.w);
      o += '<text x="'+(x+w/2).toFixed(1)+'" y="'+(PY+H/2+1)+'" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="'+tf+'">'+v+'</text>';
    }
    return o;
  }

  function dim() {
    const x0=ML, x1=VW-MR;
    const dimC = getComputedStyle(document.documentElement).getPropertyValue('--text2').trim() || '#666';
    return '<line x1="'+x0+'" y1="'+DY+'" x2="'+x1+'" y2="'+DY+'" stroke="'+dimC+'" stroke-width="1"/>'
         + '<line x1="'+x0+'" y1="'+(DY-6)+'" x2="'+x0+'" y2="'+(DY+6)+'" stroke="'+dimC+'" stroke-width="2"/>'
         + '<line x1="'+x1+'" y1="'+(DY-6)+'" x2="'+x1+'" y2="'+(DY+6)+'" stroke="'+dimC+'" stroke-width="2"/>'
         + '<text x="'+((x0+x1)/2)+'" y="'+LY+'" text-anchor="middle" font-size="11" font-weight="500" fill="'+dimC+'">'+L+' cm</text>';
  }

  let out = '';

  if (!col) {
    const sc = (VW - ML - MR) / L;
    all.forEach(s => { out += r(s, 0, sc); });
  } else {
    const EW = 42;
    const ld = deski[SHOW - 1], rd = deski[n - SHOW];

    // Lewa krawędź (koniec lewej sekcji, za szczeliną)
    let le = ld.x + ld.w;
    const af = all.find(s => s.x >= le - 0.001 && (s.t==='g'||s.t==='gk'));
    if (af && af.x <= le + 0.001) le = af.x + af.w;

    // Prawa krawędź (początek prawej sekcji, przed szczeliną)
    let rs = rd.x;
    const bf = [...all].reverse().find(s => s.x+s.w <= rs+0.001 && (s.t==='g'||s.t==='gk'));
    if (bf && bf.x+bf.w >= rs-0.001) rs = bf.x;

    const sc = (VW - ML - MR - EW) / (le + (L - rs));

    // Lewa część
    all.filter(s => s.x + s.w <= le + 0.001).forEach(s => { out += r(s, 0, sc); });

    // Wielokropek
    const ex = ML + le * sc, mc = n - 2 * SHOW;
    const ellBg = getComputedStyle(document.documentElement).getPropertyValue('--bg2').trim() || '#f0f0ee';
    const ellBd = getComputedStyle(document.documentElement).getPropertyValue('--bd').trim() || '#ccc';
    out += '<rect x="'+ex.toFixed(1)+'" y="'+PY+'" width="'+EW+'" height="'+H+'" fill="'+ellBg+'" stroke="'+ellBd+'" stroke-width="0.5" rx="3"/>';
    const ellT = getComputedStyle(document.documentElement).getPropertyValue('--text3').trim() || '#999';
    out += '<text x="'+(ex+EW/2).toFixed(1)+'" y="'+(PY+H/2-4)+'" text-anchor="middle" dominant-baseline="central" font-size="14" fill="'+ellT+'">···</text>';
    out += '<text x="'+(ex+EW/2).toFixed(1)+'" y="'+(PY+H/2+10)+'" text-anchor="middle" font-size="9" fill="'+ellT+'">'+mc+' szt</text>';

    // Prawa część — wyrównana do prawej krawędzi
    const rw = L - rs;
    const ro = (VW - MR - rw * sc) - ML;
    all.filter(s => s.x >= rs - 0.001).forEach(s => { out += r({...s, x: s.x - rs}, ro, sc); });
  }

  out += dim();
  el('viz').innerHTML = '<svg width="100%" viewBox="0 0 '+VW+' '+SH+'" role="img"><title>Rozkład desek</title>'+out+'</svg>';

  const hk = k==='ss' || k==='sd';
  el('leg').innerHTML =
    '<div class="leg-i"><div class="leg-s" style="background:#B5D4F4;border:1px solid #185FA5"></div>deska ('+R2(W)+' cm)</div>'
    + '<div class="leg-i"><div class="leg-s" style="background:rgba(150,150,150,0.15);border:1px solid #999"></div>szczelina ('+R2(G)+' cm)</div>'
    + (hk ? '<div class="leg-i"><div class="leg-s" style="background:#FAEEDA;border:1px solid #BA7517"></div>szczelina końcowa ('+R2(G)+' cm)</div>' : '');
}

// ── Tryb ciemny ──────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
}
// Przywróć zapisany tryb
(function() {
  const t = localStorage.getItem('theme');
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.setAttribute('data-theme', 'dark');
})();

// ── Eksport / Import ──────────────────────────────────────
function save() {
  const cfg = { _typ:'deski-v1', L:el('iL').value, W:el('iW').value, G:el('iG').value, N:el('iN').value, k:getK() };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}));
  a.download = 'rozklad_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function load(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const c = JSON.parse(e.target.result);
      if (c._typ !== 'deski-v1') { alert('Nieprawidłowy plik.'); return; }
      el('iL').value=c.L||''; el('iW').value=c.W||''; el('iG').value=c.G||''; el('iN').value=c.N||'';
      const rd = document.querySelector('input[name=k][value="'+c.k+'"]');
      if (rd) rd.checked = true;
      recalc();
    } catch(err) { alert('Błąd: '+err.message); }
  };
  reader.readAsText(f);
  ev.target.value = '';
}
</script>
